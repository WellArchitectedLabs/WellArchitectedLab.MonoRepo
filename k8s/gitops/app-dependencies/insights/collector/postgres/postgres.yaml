apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: insights-collector-database
  namespace: argocd
  labels:
    workload: business
    workload-type: database
    domain: insights
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    targetRevision: "15.5.0"
    helm:
      values: |
        image:
          registry: docker.io
          repository: bitnamilegacy/postgresql
          tag: "15.5.0-debian-11-r0"
          pullPolicy: IfNotPresent

        metrics:
          image:
            repository: bitnamilegacy/postgres-exporter
            tag: "0.11.1-debian-11-r0"

        auth:
          username: postgres
          existingSecret: insights-collector-db-sealed-secrets
          secretKeys:
            adminPasswordKey: POSTGRES_SUPERUSER_PASSWORD
          # Database to create on initialization
          database: insights

        primary:
          podAnnotations:
            sidecar.istio.io/inject: "false"
          persistence:
            enabled: true
            storageClass: managed-csi
            size: 1Gi

          tolerations:
            - key: "workload"
              operator: "Equal"
              value: "weather-forecast"
              effect: "NoSchedule"

          nodeSelector:
            kubernetes.azure.com/mode: user

          resources:
            requests:
              cpu: 25m
              memory: 50Mi
            limits:
              cpu: 500m
              memory: 512Mi

  destination:
    namespace: insights-collector
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 2
      backoff:
        duration: 5s