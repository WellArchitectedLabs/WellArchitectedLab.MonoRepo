services:
  master-data-service:
    # using flyway migration docker image that we pull from dockerhub
    build:
      context: ./
      dockerfile: Dockerfile.master-data-service
    ports: 
      - 82:80
    environment:
      ConnectionStrings__Postgres: "Host=masterdata-postgres;Port=5432;Database=master_data;Username=postgres;Password=postgres;Ssl Mode=Disable;"
      ASPNETCORE_ENVIRONMENT: Development