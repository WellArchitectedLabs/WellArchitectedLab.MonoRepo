name: Publish NuGet Package (Template)

on:
  workflow_call:
    inputs:
      client_project_path:
        description: "Path to the client project"
        required: true
        type: string

      package_id:
        description: "NuGet package id"
        required: true
        type: string

      increment_major:
        required: true
        type: boolean

      increment_minor:
        required: true
        type: boolean

      increment_patch:
        required: true
        type: boolean

    secrets:
      GH_PACKAGES_TOKEN:
        required: false

env:
  NUGET_SOURCE: https://nuget.pkg.github.com/WellArchitectedLabs/index.json

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate increment flags
        run: |
          COUNT=0
          [[ "${{ inputs.increment_major }}" == "true" ]] && COUNT=$((COUNT+1))
          [[ "${{ inputs.increment_minor }}" == "true" ]] && COUNT=$((COUNT+1))
          [[ "${{ inputs.increment_patch }}" == "true" ]] && COUNT=$((COUNT+1))

          if [ "$COUNT" -ne 1 ]; then
            echo "Exactly one increment flag must be true."
            exit 1
          fi
          
      - name: Compute next version
        id: next
        env:
          GH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Fetch latest version from GitHub Packages
          LATEST=$(gh api \
            /orgs/WellArchitectedLabs/packages/nuget/${{ inputs.package_id }}/versions \
            --jq '.[0].name' 2>/dev/null || echo "")

          # Fallback if no package exists yet
          if [[ -z "$LATEST" || ! "$LATEST" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            LATEST="0.0.0"
          fi

          echo "Latest version: $LATEST"

          # Split into major, minor, patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"

          # Apply increment flags
          if [[ "${{ inputs.increment_major }}" == "true" ]]; then
            MAJOR=$((MAJOR+1))
            MINOR=0
            PATCH=0
          elif [[ "${{ inputs.increment_minor }}" == "true" ]]; then
            MINOR=$((MINOR+1))
            PATCH=0
          else
            PATCH=$((PATCH+1))
          fi

          NEXT="$MAJOR.$MINOR.$PATCH"
          echo "Next version: $NEXT"

          # Output for subsequent steps
          echo "value=$NEXT" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore
        working-directory: ${{ inputs.client_project_path }}

      - name: Build
        run: dotnet build -c Release --no-restore
        working-directory: ${{ inputs.client_project_path }}

      - name: Pack
        run: |
          dotnet pack \
            -c Release \
            --no-build \
            /p:Version=${{ steps.next.outputs.value }}
        working-directory: ${{ inputs.client_project_path }}

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "**/*.nupkg" \
            --source "$NUGET_SOURCE" \
            --api-key ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        working-directory: ${{ inputs.client_project_path }}
