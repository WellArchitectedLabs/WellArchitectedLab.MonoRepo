apiVersion: v1
kind: ConfigMap
metadata:
  name: wf-exp-bff-configmap
  namespace: forecast-experience
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft.AspNetCore": "Warning"
        }
      },
      "AllowedHosts": "*",
      "Endpoints": {
        "GetInsightV1": {
          "ToDateMaxDaysFromNow": 1
        }
      }
    }
