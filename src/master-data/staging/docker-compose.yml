include:
  - ../docker-compose.yml

services:  
  cities-import:
    tty: true
    stdin_open: true
    build:
      context: ./
      dockerfile: Dockerfile.cities-initializer
    depends_on:
      masterdata-postgres:
        condition: service_healthy
      masterdata-postgres-migrate:
        condition: service_completed_successfully
    environment:
      - POSTGRES_DSN=postgresql://app_user:app_password@masterdata-postgres:5432/master_data?sslmode=disable
    volumes:
      # mount the local file in the image and mark it as read only
      - ./data/imports:/data:ro
    command: ["--input", "/data/capitals.csv"]
    # the init script needs to be ran once
    restart: "no"
  wf-actuals-import:
    tty: true
    stdin_open: true
    build:
      context: ./
      dockerfile: Dockerfile.wf-actuals-initializer
    depends_on:
      masterdata-postgres:
        condition: service_healthy
      masterdata-postgres-migrate:
        condition: service_completed_successfully
    environment:
      - POSTGRES_DSN=postgresql://app_user:app_password@masterdata-postgres:5432/master_data?sslmode=disable
    volumes:
      - ./data/imports:/data:ro
    command: ["--input", "/data/weather_hourly-full.csv"]
    restart: "no"
  wf-actuals-range-db-import:
    profiles:
      - manual
    tty: true
    stdin_open: true
    build:
      context: ./
      dockerfile: Dockerfile.wf-actuals-range
    depends_on:
      masterdata-postgres:
        condition: service_healthy
      masterdata-postgres-migrate:
        condition: service_completed_successfully
    environment:
      - POSTGRES_DSN=postgresql://app_user:app_password@masterdata-postgres:5432/master_data?sslmode=disable
    command:
      - "--from-date"
      - "${FROM_DATE:-2026-01-01}"
      - "--to-date"
      - "${TO_DATE:-2026-01-02}"
    restart: "no"

# necessary for postgres persistence
volumes:
  postgres-data: