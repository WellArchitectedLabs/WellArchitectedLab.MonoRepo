# Allow ingress from forecast-experience and insights-collector
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: master-data
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forecast-experience
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: insights-collector