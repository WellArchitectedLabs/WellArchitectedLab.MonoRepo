version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.engine-simulator
    container_name: weather-engine
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app