# .github/workflows/codeql-analysis-template.yml
name: CodeQL Analysis Template

on:
  workflow_call:
    inputs:
      solution:
        description: "Path to the .sln file to build"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  codeQLAnalysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read 
    strategy:
      matrix:
        language: ['csharp']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Debug NuGet
        run: |
          echo "Actor: $GITHUB_ACTOR"
          echo "Token length: ${#NUGET_AUTH_TOKEN}"
          dotnet nuget list source
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore dependencies
        run: dotnet restore ${{ inputs.solution }}
        env:
          # Inject env variables for GitHub Packages in Nuget.config level
          GITHUB_ACTOR: ${{ github.actor }}
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Solution
        run: |
          dotnet build ${{ inputs.solution }}

      - name: Perform Code Analysis
        uses: github/codeql-action/analyze@v3
