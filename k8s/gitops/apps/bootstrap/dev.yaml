apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-cluster-bootstrap
  namespace: argocd
  labels:
    workload: root-applications
    environment: dev
  annotations:
    # bootstrap app is a pre-requisite
    # so we'll run it before any other workload by specifying a negative sync wave index
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/WellArchitectedLabs/WellArchitectedLab.MonoRepo.git
    targetRevision: feature/42-k8S
    path: k8s/overlays/bootstrap/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    retry:
      limit: 2
      backoff:
        duration: 5s
    automated:
      prune: true
      selfHeal: true