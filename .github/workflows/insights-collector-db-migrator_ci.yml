name: CI - Build & Push Insights Db Migrator - Database

on:
    push:
        branches:
          - main
          - develop
          - 'release/**'
        paths:
          - src/insights/data/**
    pull_request:
        paths:
          - src/insights/data/**
    workflow_dispatch:

jobs:
    FlyWayDbMigrator-BuildAndPush:
        uses: ./.github/workflows/template_ci.yml
        with:
            service_name: db-migrator
            service_path: src/insights/data
            gitversion_config_path: src/insights/data/GitVersion.yml
            dockerfile_name: Dockerfile.db-migrator
        secrets:
            ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
            ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
            ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
