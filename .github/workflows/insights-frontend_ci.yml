name: CI - Build & Push Insights Frontend

on:
    push:
       branches:
            - main
            - develop
            - 'release/**'
       paths:
        - src/forecast-experience/frontend/**
    pull_request:
        paths:
          - src/forecast-experience/frontend/**
    workflow_dispatch:

jobs:
    Frontend-BuildAndPush:
        uses: ./.github/workflows/template_ci.yml
        with:
            service_name: insights-frontend
            service_path: src/forecast-experience/frontend
            gitversion_config_path: src/forecast-experience/frontend/GitVersion.yml
        secrets:
            ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
            ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
            ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
