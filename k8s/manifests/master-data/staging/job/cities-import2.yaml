apiVersion: batch/v1
kind: Job
metadata:
  name: cities-import2
  namespace: backend
  labels:
    app: cities-import2
spec:
  template:
    metadata:
      name: cities-import2
      labels:
        app: cities-import2
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      tolerations:
      - key: workload
        operator: 'Equal'
        value: 'weather-forecast'
        effect: 'NoSchedule'
      nodeSelector:
        kubernetes.azure.com/mode: user
      initContainers:
      - name: postgres-sanity-guard
        image: acrdevtshpwn.azurecr.io/postgres-sanity-guard:0.1.0-staging-scripts.1-276fa6a
        env:
          - name: DB_HOST
            value: master-data-database-postgresql.backend.svc.cluster.local
          - name: DB_PORT
            value: "5432"
          - name: DB_NAME
            value: master_data
          - name: DB_APP_USER
            valueFrom:
              secretKeyRef:
                name: master-data-db-secrets
                key: DB_APP_USER
          - name: DB_APP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: master-data-db-secrets
                key: DB_APP_PASSWORD
          - name: POSTGRES_SUPERUSER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: master-data-db-secrets
                key: POSTGRES_SUPERUSER_PASSWORD
          - name: MAX_RETRIES
            value: "30"
          - name: RETRY_INTERVAL
            value: "2"
      containers:
      - name: cities-import2
        image: acrdevtshpwn.azurecr.io/cities-initializer:0.1.0-staging-scripts.1-cd835b2
        args: ["--input", "/mnt/blob/capitals.csv"]
        env:
          - name: POSTGRES_DSN
            valueFrom:
              secretKeyRef:
                name: master-data-db-secrets
                key: DB_APP_DSN
        volumeMounts:
        - name: imports-blob
          mountPath: "/mnt/blob"
      
      volumes:
      - name: imports-blob
        persistentVolumeClaim:
          claimName: dev-pvc-az-blob-imports
      
      restartPolicy: Never