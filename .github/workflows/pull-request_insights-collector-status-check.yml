name: Status Check - Insights Collector Pull Request Build Check

on:
    pull_request:
      branches:
          - main
          - develop
          - 'release/**'
      paths:
        - src/insights/collector/**
    workflow_dispatch:  # allows manual testing

jobs:
  frontend-buildCheck:
    name: Insights Collector  Status Check - Try package docker image
    uses: ./.github/workflows/template_ci.yml
    with:
      service_name: insights-collector
      service_path: src/insights/collector/
      gitversion_config_path: src/insights/collector/GitVersion.yml
      dockerfile_name: Dockerfile.insights-collector
      #status check doesn't push into ACR
      push_to_registry: false
    secrets:
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
