apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# reference needed master data service manifests from base folder
resources:
  - ../../../../manifests/master-data/service
  - secrets/db-access.yaml
  - config-maps/master-data-service.yaml

# adds a metadata.label for every resource created by this kustomize hop
# this allows easy resource managemnt using -l filters
commonLabels:
  environment: dev
  domain: master-data-service