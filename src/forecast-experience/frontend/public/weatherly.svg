<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>

    <!-- Deep navy background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d2140"/>
      <stop offset="100%" stop-color="#060d1a"/>
    </linearGradient>

    <!-- Blue glow gradient for the area fill -->
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#63b3ed" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#63b3ed" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Subtle inner glow on the background -->
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%"   stop-color="#1a4a7a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#060d1a" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip to the rounded square -->
    <clipPath id="roundedClip">
      <rect width="32" height="32" rx="7" ry="7"/>
    </clipPath>

  </defs>

  <!-- ── Background ── -->
  <rect width="32" height="32" rx="7" ry="7" fill="url(#bg)"/>
  <rect width="32" height="32" rx="7" ry="7" fill="url(#glow)"/>

  <!-- ── Subtle grid lines (horizontal) — represent axis context ── -->
  <g clip-path="url(#roundedClip)" opacity="0.12">
    <line x1="4" y1="10" x2="28" y2="10" stroke="#63b3ed" stroke-width="0.5"/>
    <line x1="4" y1="17" x2="28" y2="17" stroke="#63b3ed" stroke-width="0.5"/>
    <line x1="4" y1="24" x2="28" y2="24" stroke="#63b3ed" stroke-width="0.5"/>
  </g>

  <!-- ── Area chart: precipitation layer (bottom, muted purple) ── -->
  <g clip-path="url(#roundedClip)">
    <path
      d="M4,24 C6,23 7,22.5 8,22 C9.5,21.2 10,22 11.5,21.5 C13,21 14,20.5 15,21 C16.5,21.5 17,21 18.5,20.5 C20,20 21,21 22.5,20 C24,19 25,20 28,19.5 L28,28 L4,28 Z"
      fill="#b794f4"
      fill-opacity="0.18"
    />
    <path
      d="M4,24 C6,23 7,22.5 8,22 C9.5,21.2 10,22 11.5,21.5 C13,21 14,20.5 15,21 C16.5,21.5 17,21 18.5,20.5 C20,20 21,21 22.5,20 C24,19 25,20 28,19.5"
      fill="none"
      stroke="#b794f4"
      stroke-width="0.7"
      stroke-opacity="0.45"
    />
  </g>

  <!-- ── Area chart: temperature layer (main, bright blue) ── -->
  <g clip-path="url(#roundedClip)">
    <path
      d="M4,22 C5.5,20 6.5,18 8,16.5 C9.5,15 10.5,16 12,14 C13.5,12 14.5,13.5 16,12 C17.5,10.5 18.5,12 20,11 C21.5,10 23,12 24.5,11 C26,10 27,11.5 28,10.5 L28,28 L4,28 Z"
      fill="url(#areaFill)"
    />
    <path
      d="M4,22 C5.5,20 6.5,18 8,16.5 C9.5,15 10.5,16 12,14 C13.5,12 14.5,13.5 16,12 C17.5,10.5 18.5,12 20,11 C21.5,10 23,12 24.5,11 C26,10 27,11.5 28,10.5"
      fill="none"
      stroke="#63b3ed"
      stroke-width="1.4"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
  </g>

  <!-- ── Timeline cursor line — the "insight" moment ── -->
  <g clip-path="url(#roundedClip)">
    <!-- Vertical dashed line -->
    <line
      x1="20" y1="7"
      x2="20" y2="26"
      stroke="#63b3ed"
      stroke-width="0.9"
      stroke-dasharray="1.5,2"
      stroke-opacity="0.7"
    />
    <!-- Cursor dot on the temperature curve (approx y=11 at x=20) -->
    <circle cx="20" cy="11" r="2.2" fill="#060d1a" stroke="#63b3ed" stroke-width="1.2"/>
    <circle cx="20" cy="11" r="0.9" fill="#63b3ed"/>
  </g>

  <!-- ── Outer border for definition at small sizes ── -->
  <rect
    width="32" height="32" rx="7" ry="7"
    fill="none"
    stroke="#63b3ed"
    stroke-width="0.6"
    stroke-opacity="0.2"
  />

</svg>
