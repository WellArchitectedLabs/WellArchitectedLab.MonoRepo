apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-master-data-app
  namespace: argocd
  labels:
    workload: business
    environment: dev
    domain: master-data
spec:
  project: default
  source:
    repoURL: https://github.com/WellArchitectedLabs/WellArchitectedLab.MonoRepo.git
    targetRevision: feature/k8sfullStack
    path: k8s/overlays/weatherly/master-data/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 2
      backoff:
        duration: 5s