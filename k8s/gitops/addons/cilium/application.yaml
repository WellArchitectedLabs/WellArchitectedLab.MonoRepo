apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default

  source:
    repoURL: https://helm.cilium.io/
    chart: cilium
    targetRevision: 1.19.1
    helm:
      releaseName: cilium
      values: |
        # --- AKS CNI chaining (legacy mode) ---
        # azure-cni is no longer a valid chainingMode value since Cilium 1.16+.
        # The correct value is generic-veth, and the actual chain definition
        # (azure-vnet → portmap → cilium) is declared in the cni-configuration
        # ConfigMap deployed separately.
        # Note: Cilium now considers this the legacy approach. The recommended
        # paths are BYO CNI (Cilium as sole CNI) or Azure CNI Powered by Cilium
        # (managed by AKS via --network-dataplane cilium at cluster creation).
        # In this project, we chose to go for a custom CNI pipeline with integration with Azure CNI
        # Which will continue to handle IP address pre allocation (ipam) and routing, which Cilium will
        # integrate into physical veth interfaces, created by Azure CNI, and inject their network policy logic via extended Berkeley Packet Filter technology
        # Allowing integration of network policies directly on linux kernel.
        # All this config would be more simple with direct cilium integration via --network-dataplane cilium at cluster creation, but we want to show how to do it with a custom configuration for learning purposes.
        cni:
          chainingMode: generic-veth # keep the classic / generic virtual ethernet management layer, like managed by Azure CNI 
          customConf: true       # tell Cilium to use the ConfigMap instead of writing its own CNI config
          exclusive: false       # allow Azure CNI to coexist
          configMap: cni-configuration

        # --- Routing ---
        # Azure CNI handles cross-node routing natively via the VNet SDN,
        # so no overlay tunnel is needed.
        routingMode: native
        enableIPv4Masquerade: false
        endpointRoutes:
          enabled: true

        # --- Node init ---
        # Required to update the Azure CNI plugin to transparent mode on each node.
        nodeinit:
          enabled: true

        azure:
          enabled: true

        # --- DO NOT replace kube-proxy ---
        # kube-proxy will continue to handle Service routing (ClusterIP → pod IP
        # translation) via iptables. Cilium will handle L4/L7 policy enforcement
        # using its rich CiliumNetworkPolicy syntax.
        # Cilium is also able to fully replace kube-proxy via eBPF, but that is
        # not the chosen approach here.
        # Note: k8sServiceHost/k8sServicePort are NOT needed here — they are only
        # required when kubeProxyReplacement is true, to break the chicken-and-egg
        # dependency of Cilium needing to resolve the API server ClusterIP before
        # kube-proxy has set up the iptables rules for it.
        kubeProxyReplacement: false

        # --- IPAM ---
        ipam:
          mode: kubernetes

        # --- Disable extras (minimal footprint) ---
        hubble:
          # hubble is cilium's observability platform. We will use prometheus and
          # grafana for monitoring and observability, so hubble is disabled here.
          enabled: false

        prometheus:
          # Cilium can expose its own prometheus metrics. We disable the standalone
          # scraping here since we integrate with our existing prometheus instance.
          enabled: false

        operator:
          replicas: 1

        # --- Enable policy enforcement ---
        policyEnforcementMode: default

        # --- Resource tuning (minimal but safe) ---
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m