name: Status Check - Master Data Service Pull Request Build Check

on:
    pull_request:
      branches:
          - main
          - develop
          - 'release/**'
      paths:
        - src/master-data/service/**
    workflow_dispatch:  # allows manual testing

jobs:
  frontend-buildCheck:
    name: Master Data Service Status Check - Try package docker image
    uses: ./.github/workflows/template_ci.yml
    with:
      service_name: master-data-service
      service_path: src/master-data/service/
      gitversion_config_path: src/master-data/service/GitVersion.yml
      dockerfile_name: Dockerfile.master-data-service
      #status check doesn't push into ACR
      push_to_registry: false
    secrets:
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
