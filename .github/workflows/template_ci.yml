name: Template - Docker build and push
on:
    workflow_call:
        inputs:
            push_to_registry:
              default: true
              type: boolean
            service_name:
              required: true
              type: string
            service_path:
              required: true
              type: string
            gitversion_config_path:
              required: true
              type: string
            dockerfile_name:
              required: false
              type: string
              default: Dockerfile
        secrets:
          ACR_LOGIN_SERVER:
            required: true
          ACR_USERNAME:
            required: true
          ACR_PASSWORD:
            required: true

# Setup the GITHUB_TOKEN permissions
permissions:
  contents: read
  packages: read

jobs:
    Versionning:
        runs-on: ubuntu-latest
        outputs:
            version:  ${{ steps.gitversion.outputs.semVer }}
            sha: ${{ steps.sha.outputs.short }}
        
        steps:
           - name: Checkout repository
             uses: actions/checkout@v4
             with:
               fetch-depth: 0

           - name: Install GitVersion
             uses: gittools/actions/gitversion/setup@v0.10.2
             with:
                versionSpec: "5.x"
            
           - name: Run GitVersion
             id: gitversion
             uses: gittools/actions/gitversion/execute@v0.10.2
             with:
               configFilePath: ${{ inputs.gitversion_config_path }}

           - name: Get short SHA
             id: sha
             run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    BuildAndPushImage:
        needs: [Versionning]
        name: Build & Push service
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Set image name
              run: |
                VERSION_TAG="${{ needs.versionning.outputs.version }}-${{ needs.versionning.outputs.sha }}"
                IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/${{ inputs.service_name }}:$VERSION_TAG"
                echo "IMAGE=$IMAGE" >> $GITHUB_ENV

            # This step is necessary for accessing GitHub Packages
            # For that, we create an ephemeral secret file
            # With the github action default access credentials (secrets.GITHUB_TOKEN and github.actor)
            - name: Create GitHub Packages secret file
              run: |
                mkdir -p /tmp/docker-secrets
                echo '{
                  "github": {
                    "username": "${{ github.actor }}",
                    "token": "${{ secrets.GITHUB_TOKEN }}"
                  }
                }' > /tmp/docker-secrets/dev_secrets.json

            - name: Login to ACR
              uses: docker/login-action@v3
              with:
                registry: ${{ secrets.ACR_LOGIN_SERVER }}
                username: ${{ secrets.ACR_USERNAME }}
                password: ${{ secrets.ACR_PASSWORD }}

            - name: Build image
              working-directory: ${{ inputs.service_path }}
              run: |
                DOCKER_BUILDKIT=1 docker build \
                  --secret id=dev_secrets,src=/tmp/docker-secrets/dev_secrets.json \
                  -t $IMAGE \
                  -f ${{ inputs.dockerfile_name }} .

            # Remove secret file used for docker BuildKit
            - name: Cleanup secret file
              if: always()
              run: rm -rf /tmp/docker-secrets

            - name: Push image
              if: ${{ inputs.push_to_registry == true }}
              run: docker push $IMAGE