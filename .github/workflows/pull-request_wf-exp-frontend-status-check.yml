name: Status Check - Forecast Experience Frontend Pull Request Build Check

on:
    pull_request:
      branches:
          - main
          - develop
          - 'release/**'
      paths:
        - src/forecast-experience/frontend/**
    workflow_dispatch:  # allows manual testing

jobs:
  frontend-buildCheck:
    name: Forecast Experience Frontend Status Check - Try package docker image
    uses: ./.github/workflows/template_ci.yml
    with:
      service_name: wf-exp-frontend
      service_path: src/forecast-experience/frontend/
      gitversion_config_path: src/forecast-experience/frontend/GitVersion.yml
      dockerfile_name: Dockerfile.wf-exp-frontend
      #status check doesn't push into ACR
      push_to_registry: false
    secrets:
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
