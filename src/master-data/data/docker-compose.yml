services:
  masterdata-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: master_data
    volumes:
      - master-data-postgres-data:/var/lib/postgresql/data
    ports:
      # necessary for exposing the database instance
      # database instance is exposed on 5431 port to avoid port conflicts with any local postgres instance
      - 5431:5432
    networks:
      - weatherly-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  # We apply the latest migrations
  masterdata-postgres-migrate:
    # using flyway migration docker image that we pull from dockerhub
    build:
      context: ./
      dockerfile: Dockerfile.db-migrator
    depends_on:
      masterdata-postgres:
        condition: service_healthy
    # we point to the local postgres db
    command: >
      -url=jdbc:postgresql://masterdata-postgres:5432/master_data
      -user=postgres
      -password=postgres
      -baselineOnMigrate=true
      -validateOnMigrate=true
      migrate
    # very important in order to execute migration only once
    restart: "no"
    environment:
      DB_APP_USER: app_user
      DB_APP_PASSWORD: app_password
      POSTGRES_DATABASE: master_data
    networks:
      - weatherly-network

volumes:
  master-data-postgres-data:

networks:
  weatherly-network:
    external: true
    name: weatherly-network