# .github/workflows/codeql-master-data-service.yml
name: CodeQL Analysis - Master Data Service

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/master-data/service/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/master-data/service/**'
  workflow_dispatch:

jobs:
  call-codeql-template:
    uses: ./.github/workflows/template_csharp-codeql.yml
    with:
      solution: 'src/master-data/service/MasterData.slnx'
