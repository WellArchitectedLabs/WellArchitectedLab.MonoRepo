apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# reference all manifests from base folder
resources:
  - ../../../../../manifests/insights/collector
  - config-maps/insights-collector.yaml
  - ../../../../../gitops/app-dependencies/insights/collector
  # - ../../../manifests/tools/htg

# adds a metadata.label for every resource created by this kustomize hop
# this allows easy resource managemnt using -l filters
commonLabels:
  environment: dev
  domain: insights