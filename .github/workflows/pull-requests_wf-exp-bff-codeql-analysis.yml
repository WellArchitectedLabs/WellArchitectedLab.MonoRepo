# .github/workflows/codeql-insights-bff.yml
name: CodeQL Analysis - Forecast Experience Bff

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/forecast-experience/bff/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/forecast-experience/bff/**'
  workflow_dispatch:

jobs:
  call-codeql-template:
    uses: ./.github/workflows/template_csharp-codeql.yml
    with:
      solution: 'src/forecast-experience/bff/WfExperience.Bff.slnx'
