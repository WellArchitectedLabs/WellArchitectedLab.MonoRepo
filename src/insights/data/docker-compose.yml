services:
  insights-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: insights_database
    volumes:
      - insights-postgres-data:/var/lib/postgresql/data
    ports:
      # necessary for exposing the database instance
      # database instance is exposed on 5430 port to avoid port conflicts with any local postgres instance
      # and also with master data db which is exposed on 5431 port
      - 5430:5432
    networks:
      - weatherly-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  # We apply the latest migrations
  insights-postgres-migrate:
    # using flyway migration docker image that we pull from dockerhub
    build:
      context: ./
      dockerfile: Dockerfile.db-migrator
    depends_on:
      insights-postgres:
        condition: service_healthy
    # we point to the local postgres db
    command: >
      -url=jdbc:postgresql://insights-postgres:5432/insights_database
      -user=postgres
      -password=postgres
      -baselineOnMigrate=true
      -validateOnMigrate=true
      migrate
    # very important in order to execute migration only once
    restart: "no"
    environment:
      DB_APP_USER: app_user
      DB_APP_PASSWORD: app_password
      POSTGRES_DATABASE: insights_database
    networks:
      - weatherly-network

volumes:
  insights-postgres-data:

networks:
  weatherly-network:
    external: true
    name: weatherly-network