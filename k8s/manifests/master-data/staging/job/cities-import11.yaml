apiVersion: batch/v1
kind: Job
metadata:
  name: cities-import11
  namespace: backend
  labels:
    app: cities-import11
spec:
  template:
    annotations:
      sidecar.istio.io/inject: "false" # prevent istio sidecar from intercepting traffic
    metadata:
      name: cities-import11
      labels:
        app: cities-import11
    spec:
      # This is very important in order for csv resolving to work
      # Container needs to be ran as root
      securityContext:
        runAsUser: 0 #root
        runAsGroup: 0
        fsGroup: 0
      tolerations:
      - key: workload
        operator: 'Equal'
        value: 'weather-forecast'
        effect: 'NoSchedule'
      # Where will my pods will run, and in what node label
      # We should add a toleration because the user nodes are tainted and will be not schedule the pods if the taint is not provided
      nodeSelector:
        kubernetes.azure.com/mode: user
      initContainers:
      - name: wait-for-postgres
        image: bitnamilegacy/postgresql:15.5.0-debian-11-r0
        command:
          - /bin/sh
          - -c
          - |
            until pg_isready -h master-data-database-postgresql.backend.svc.cluster.local -U masterdata_app; do
              echo "Waiting for Postgres..."
              sleep 2
            done
      containers:
      - name: cities-import11
        image: acrdevtshpwn.azurecr.io/cities-initializer:0.1.0-PullRequest0089.460-8063c85
        args: ["--input", "/mnt/blob/capitals.csv"]
        env:
          - name: POSTGRES_DSN
            value: postgresql://masterdata_app:appsecret@master-data-database-postgresql:5432/master_data
        volumeMounts:
        - name: imports-blob
          mountPath: "/mnt/blob"
      volumes:
      - name: imports-blob
        persistentVolumeClaim:
          # reference created claim resource
          claimName: dev-pvc-az-blob-imports2
      restartPolicy: Never