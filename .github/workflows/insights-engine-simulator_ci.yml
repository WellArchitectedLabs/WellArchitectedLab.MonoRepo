name: CI - Build Insights Collector

on:
    push:
       branches:
            - main
            - develop
            - 'release/**'
       paths:
        - src/insights/collector/**
    pull_request:
        paths:
          - src/insights/collector/**
    workflow_dispatch:

jobs:
    InsightsCollector-BuildAndPush:
        uses: ./.github/workflows/template_ci.yml
        with:
            service_name: insights-engine-sim
            service_path: src/insights/engine-simulator
            gitversion_config_path: src/insights/engine-simulator/GitVersion.yml
            dockerfile_name: Dockerfile.engine-simulator
        secrets:
            ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
            ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
            ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
