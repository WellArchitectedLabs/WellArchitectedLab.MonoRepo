apiVersion: batch/v1
kind: Job
metadata:
  name: cities-import14
  namespace: backend
  labels:
    app: cities-import14
spec:
  template:
    metadata:
      name: cities-import14
      labels:
        app: cities-import14
      annotations:
        sidecar.istio.io/inject: "false" # prevent istio sidecar from intercepting traffic
    spec:
      # This is very important in order for csv resolving to work
      # Container needs to be ran as root
      securityContext:
        runAsUser: 0 #root
        runAsGroup: 0
        fsGroup: 0
      tolerations:
      - key: workload
        operator: 'Equal'
        value: 'weather-forecast'
        effect: 'NoSchedule'
      # Where will my pods will run, and in what node label
      # We should add a toleration because the user nodes are tainted and will be not schedule the pods if the taint is not provided
      nodeSelector:
        kubernetes.azure.com/mode: user
      initContainers:
      # Comprehensive Postgres health check
      - name: wait-for-postgres
        image: bitnamilegacy/postgresql:15.5.0-debian-11-r0
        env:
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: master-data-db-secrets
                key: POSTGRES_SUPERUSER_PASSWORD
        command:
          - /bin/sh
          - -c
          - |
            echo "Checking PostgreSQL availability..."
            
            # Step 1: Check if PostgreSQL is accepting connections
            until pg_isready -h master-data-database-postgresql.backend.svc.cluster.local -p 5432; do
              echo "PostgreSQL not ready yet..."
              sleep 2
            done
            echo "✓ PostgreSQL is accepting connections"
            
            # Step 2: Verify database exists
            until psql -h master-data-database-postgresql.backend.svc.cluster.local \
                       -U masterdata_app \
                       -d master_data \
                       -c "SELECT 1" > /dev/null 2>&1; do
              echo "Database 'master_data' not ready or user 'masterdata_app' cannot connect..."
              sleep 3
            done
            echo "✓ Database 'master_data' exists and is accessible"
            
            # Step 3: Verify user has necessary permissions (check if can query tables)
            echo "Checking user permissions..."
            psql -h master-data-database-postgresql.backend.svc.cluster.local \
                 -U masterdata_app \
                 -d master_data \
                 -c "\dt" > /dev/null 2>&1
            echo "✓ User 'masterdata_app' has proper permissions"
            
            echo "All PostgreSQL checks passed! Starting main container..."
      containers:
      - name: cities-import14
        image: acrdevtshpwn.azurecr.io/cities-initializer:0.1.0-PullRequest0089.460-8063c85
        args: ["--input", "/mnt/blob/capitals.csv"]
        env:
          - name: POSTGRES_DSN
            valueFrom:
              secretKeyRef:
                name: master-data-db-secrets
                key: DB_APP_USER
        volumeMounts:
        - name: imports-blob
          mountPath: "/mnt/blob"
      volumes:
      - name: imports-blob
        persistentVolumeClaim:
          # reference created claim resource
          claimName: dev-pvc-az-blob-imports2
      restartPolicy: Never