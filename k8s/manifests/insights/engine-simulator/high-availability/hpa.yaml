apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: insights-engine-sim-hpa
  namespace: insights-engine-sim
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: insights-engine-sim
  minReplicas: 1
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70